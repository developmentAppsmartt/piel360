# Stack de producción para el VPS (CloudPanel maneja Nginx + SSL por fuera,
# apuntando como reverse proxy a los puertos publicados acá — ver
# docs/despliegue-vps.md). Postgres/Redis no llevan `ports:` publicado: solo
# son alcanzables dentro de la red interna de Docker Compose, nunca desde
# internet.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:4000:3000"

volumes:
  pgdata:
  redisdata:
