<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>reCAPTCHA</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }
    .wrap {
      padding: 20px 16px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      min-height: 100vh;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      text-align: center;
    }
    p {
      margin: 0 0 20px;
      font-size: 13px;
      color: #4b5563;
      text-align: center;
      max-width: 320px;
    }
    .widget {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      min-height: 78px;
      min-width: 304px;
    }
    .ok {
      margin-top: 16px;
      color: #15803d;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }
    .err {
      margin-top: 16px;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Verificación de seguridad</h1>
    <p>Marca la casilla. Si aparecen imágenes, selecciónalas y pulsa Verificar.</p>
    <div class="widget">
      <div id="recaptcha"></div>
    </div>
    <p id="ok" class="ok" hidden>Listo. Volviendo a la app…</p>
    <p id="err" class="err" hidden></p>
  </div>
  <script>
    function qs(name) {
      var m = new URLSearchParams(window.location.search).get(name);
      return m ? String(m) : '';
    }
    function post(payload) {
      try {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify(payload));
        }
      } catch (e) {}
    }
    function showErr(msg) {
      var el = document.getElementById('err');
      el.hidden = false;
      el.textContent = msg;
      document.getElementById('ok').hidden = true;
      post({ type: 'error', message: msg });
    }
    function finish(token) {
      document.getElementById('err').hidden = true;
      document.getElementById('ok').hidden = false;
      post({ type: 'verify', token: token });
      // Safari / Chrome Custom Tabs (expo-web-browser): vuelve a la app.
      // Expo Go usa exp://…; build nativo usa piel360://…
      var ret = qs('return');
      if (ret && /^(piel360|exp|exps):\/\//i.test(ret)) {
        var sep = ret.indexOf('?') >= 0 ? '&' : '?';
        setTimeout(function () {
          window.location.href = ret + sep + 'token=' + encodeURIComponent(token);
        }, 250);
      }
    }
    var siteKey = qs('sitekey');
    var hl = qs('hl') || 'es';
    if (!siteKey) {
      showErr('Falta sitekey');
    } else {
      var s = document.createElement('script');
      s.src = 'https://www.google.com/recaptcha/api.js?onload=onRecaptchaApiLoad&render=explicit&hl=' + encodeURIComponent(hl);
      s.async = true;
      s.defer = true;
      s.onerror = function () {
        showErr('No se pudo cargar el script de Google reCAPTCHA.');
      };
      document.head.appendChild(s);
    }
    function onVerify(token) {
      var t = String(token || '');
      if (!t) {
        showErr('No se obtuvo token. Completa el desafío de nuevo.');
        return;
      }
      finish(t);
    }
    function onExpire() {
      document.getElementById('ok').hidden = true;
      post({ type: 'expire' });
    }
    function onError() {
      showErr('Error al cargar reCAPTCHA. Añade este dominio a la key (localhost o piel360.com).');
    }
    window.onRecaptchaApiLoad = function () {
      try {
        grecaptcha.render('recaptcha', {
          sitekey: siteKey,
          size: 'normal',
          callback: onVerify,
          'expired-callback': onExpire,
          'error-callback': onError,
        });
        post({ type: 'ready' });
      } catch (e) {
        showErr((e && e.message) ? e.message : 'No se pudo iniciar reCAPTCHA');
      }
    };
    window.readRecaptchaResponse = function () {
      var t = '';
      try { t = grecaptcha.getResponse() || ''; } catch (e) {}
      post({ type: 'response', token: String(t) });
    };
  </script>
</body>
</html>
